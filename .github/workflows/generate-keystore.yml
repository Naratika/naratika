name: Generate Signing Keystore (run once)

# One-time use: generates a release signing keystore in the cloud so you
# don't need `keytool` or Android Studio installed locally.
# After running this, download the artifact, SAVE IT SOMEWHERE SAFE
# (outside this repo), then delete this workflow run's artifact from
# GitHub for security — the keystore should not live in GitHub long-term
# except as the base64 secret you'll set up in the next step.

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: "Alias name for the key (e.g. naratika-release)"
        required: true
        default: "naratika-release"
      store_password:
        description: "Password for the keystore file"
        required: true
      key_password:
        description: "Password for the key itself (can be same as store password)"
        required: true
      org_name:
        description: "Your name or organization (for the certificate)"
        required: true
        default: "Naratika"
      validity_years:
        description: "Certificate validity in years"
        required: true
        default: "30"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17 (provides keytool)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Generate keystore
        run: |
          VALIDITY_DAYS=$(( ${{ inputs.validity_years }} * 365 ))
          keytool -genkeypair \
            -v \
            -keystore naratika-release.jks \
            -alias "${{ inputs.key_alias }}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity "$VALIDITY_DAYS" \
            -storepass "${{ inputs.store_password }}" \
            -keypass "${{ inputs.key_password }}" \
            -dname "CN=${{ inputs.org_name }}, OU=Naratika, O=${{ inputs.org_name }}, L=Jember, ST=East Java, C=ID"

      - name: Base64-encode keystore (for GitHub Secrets)
        run: base64 -w 0 naratika-release.jks > naratika-release.jks.b64

      - name: Upload keystore + base64 as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: naratika-release-keystore
          path: |
            naratika-release.jks
            naratika-release.jks.b64
          retention-days: 7
