name: Build Signed Release APK

# Builds a production-signed APK entirely on GitHub's servers.
# Requires these repository secrets to be set first (Settings → Secrets
# and variables → Actions):
#   ANDROID_KEYSTORE_BASE64  — contents of naratika-release.jks.b64
#   KEYSTORE_PASSWORD        — the store password you chose
#   KEY_ALIAS                — the key alias you chose (e.g. naratika-release)
#   KEY_PASSWORD             — the key password you chose
on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend (production API URL)
        run: npm run build
        env:
          VITE_API_BASE_URL: https://naratika-api.onrender.com/api

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode keystore from secret
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks

      - name: Build signed release APK
        working-directory: client/android
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: app/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Remove keystore from workspace
        if: always()
        run: rm -f client/android/app/release.jks

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: naratika-release-apk
          path: client/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
