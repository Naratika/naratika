name: Build Android APK

# Runs on GitHub's servers — no local Android Studio/SDK needed on your machine.
# Trigger manually from the GitHub Actions tab, or automatically on push to main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend (production API URL)
        run: npm run build
        env:
          VITE_API_BASE_URL: https://naratika-api.onrender.com/api

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: client/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: naratika-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
